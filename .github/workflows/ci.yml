# OpenPTS 持续集成：后端 Go 自检 + 前端 TypeScript 自检。
# 所有 PR 必须全绿才能合并（main 分支受保护）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download deps
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    # 仅报告，不阻断（依赖漏洞修复周期长；新增高危漏洞时手动跟进）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Go 已知漏洞（govulncheck 官方 action）。
      - name: Go vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend
      # npm 依赖已知漏洞（仅报告，npm audit 误报率较高）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (report only)
        run: cd frontend && npm audit --audit-level=high || true

