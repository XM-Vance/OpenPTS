        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                schedule: { type: string, description: 计划描述 }
                action: { type: string, enum: [declaration_export, external] }
      responses:
        '200': { description: 已注册 }
        '400': { description: 参数错误 }

  /api/v1/rpa/jobs/{name}/trigger:
    post:
      tags: [调度]
      summary: 手动触发 RPA job（WP3.5）
      description: |
        declaration_export（内建动作）：扫描 submitted 申报单并导出 xlsx 报送文件，同步落 run；
        external：创建 running run，由外挂执行器经 POST /rpa/runs 上报结果。
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200': { description: run 已创建/已完成 }
        '404': { description: job 不存在 }

  /api/v1/rpa/runs:
