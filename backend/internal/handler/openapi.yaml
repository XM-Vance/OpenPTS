                status: { type: string, description: active/maintenance/offline }
      responses:
        '201': { description: 已创建 }
        '400': { description: 参数错误/未选省份 }

  /api/v1/storage/stations/{id}:
    put:
      tags: [系统]
      summary: 更新储能站点（部分字段可选）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已更新 }
        '404': { description: 站点不存在 }
    delete:
      tags: [系统]
      summary: 删除储能站点（日运营记录级联删除）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已删除 }

  /api/v1/storage/schedule/generate:
    post:
      tags: [系统]
      summary: 生成储能调度计划（WP5.1：日前价 96 点 + LP 求解 → storage_schedules）
      description: |
        取 schedule_date 当日已导入日前价（48→96 点，dt=0.25h）+ 站点容量/功率，
        调 linopy/HiGHS LP 求解充放电计划（SOC 动态/容量/期末不净耗电约束），
        落 storage_schedules 96 行（同站同日覆盖）。无价格数据返回 400 引导导入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_id, schedule_date]
              properties:
                station_id: { type: string, format: uuid }
                schedule_date: { type: string, format: date }
      responses:
        '200': { description: 计划已生成（periods/profit/method/optimization_id） }
        '400': { description: 无价格数据/参数错误 }
        '502': { description: LP 服务不可达 }

  /api/v1/storage/schedule:
    get:
      tags: [系统]
      summary: 查询储能调度计划（激活 storage_schedules 死表）
      parameters:
        - { in: query, name: station_id, schema: { type: string, format: uuid } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200': { description: 96 点计划行列表 }

  /api/v1/declarations:
