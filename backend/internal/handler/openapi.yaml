        '200': { description: 持仓列表 }

  /api/v1/carbon/compliance:
    put:
      tags: [价格]
      summary: 录入年度应清缴配额（WP5.5）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compliance_year, quota_tons]
              properties:
                compliance_year: { type: integer }
