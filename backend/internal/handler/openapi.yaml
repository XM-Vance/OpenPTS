      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capacity_mwh, max_power_mw]
              properties:
                name: { type: string }
                capacity_mwh: { type: number, description: 容量 MWh }
                max_power_mw: { type: number, description: 最大功率 MW }
