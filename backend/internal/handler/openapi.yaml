      description: 'Authorization: Bearer ptis_xxx；status success/failed，重复收口拒绝。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, status]
              properties:
                run_id: { type: string, format: uuid }
                status: { type: string, enum: [success, failed] }
                output_files: { type: integer }
                output_bytes: { type: integer }
                error: { type: string }
      responses:
        '200': { description: run 已收口 }
        '401': { description: API Key 无效 }
        '404': { description: run 不存在或已收口 }

  /api/v1/rpa/jobs/{name}/next-task:
    get:
      tags: [调度]
      summary: RPA 取活（WP3.5，API Key）——返回待执行任务（如待报送申报单）
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200': { description: 任务清单（含 export_url） }
        '401': { description: API Key 无效 }

  /api/v1/carbon/trades:
