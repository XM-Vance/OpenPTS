        - { in: query, name: start, schema: { type: string, format: date } }
        - { in: query, name: end, schema: { type: string, format: date } }
      responses:
        '200': { description: 申报列表 }

  /api/v1/declarations/{type}/{date}:
    put:
      tags: [价格]
      summary: 保存申报草稿（同类型同日覆盖；已确认终态拒绝）
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [day_ahead, rolling, storage] } }
        - { in: path, name: date, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periods]
              properties:
                periods:
                  type: array
                  items:
                    type: object
                    required: [period, volume_mwh]
                    properties:
                      period: { type: integer, minimum: 1, maximum: 96 }
                      volume_mwh: { type: number }
                      price: { type: number, description: 元/MWh（可选） }
                source: { type: string, description: manual / forecast_suggest }
                note: { type: string }
      responses:
        '200': { description: 已保存草稿 }
        '400': { description: 参数错误/终态拒绝/未选省份 }

  /api/v1/declarations/suggest/day-ahead/{date}:
    get:
      tags: [价格]
      summary: 申报建议曲线（系统聚合负荷预测 96 点 → 逐时段 MWh；无预测 400 引导先跑预测）
      parameters:
        - { in: path, name: date, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: periods + 总量 + 预测来源 }
        '400': { description: 无预测数据 }

  /api/v1/declarations/{id}:
    get:
      tags: [价格]
      summary: 申报详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 申报单 }
        '404': { description: 不存在 }

  /api/v1/declarations/{id}/submit:
    post:
      tags: [价格]
      summary: 提交申报（draft → submitted）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已提交 }
        '400': { description: 状态不允许 }

  /api/v1/declarations/{id}/confirm:
    post:
      tags: [价格]
      summary: 确认申报（submitted → confirmed，终态）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已确认 }
        '400': { description: 状态不允许 }

  /api/v1/declarations/{id}/void:
