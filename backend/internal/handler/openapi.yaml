      summary: 合同电价日汇总（WP2.3，自空态 stub 实现真逻辑）
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200':
          description: kpis（总量/加权均价/区间）+ type_summary（分套餐明细）

  /api/v1/contract-price-trend/price-trend:
    get:
      tags: [价格]
      summary: 合同电价日趋势（WP2.3）
      parameters:
        - { in: query, name: start_date, schema: { type: string, format: date } }
        - { in: query, name: end_date, schema: { type: string, format: date } }
      responses:
        '200':
          description: daily_trends 序列（period_48_trends 暂无数据源返回空）

  /api/v1/load/medium-forecast/compute:
    post:
      tags: [负荷]
      summary: 生成中长期负荷预测（WP2.3，真实月度电量输入）
      description: |
        历史 ≥13 月：同比 ×(1+近3月同比增速均值)；6~12 月：近 6 月均值外推（置信低）；
        <6 月：400 引导先导入表计/负荷数据（不造数）。结果落 medium_load_forecast。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                months: { type: integer, default: 6 }
      responses:
        '200': { description: 逐月预测与方法标注 }
        '400': { description: 历史月度电量不足 }

  /api/v1/price/trend/daily:
    get:
      tags: [价格]
      summary: 现货日均价序列（含峰平谷）
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses: { '200': { description: 日序列 } }

  /api/v1/price/forecast:
    post:
      tags: [价格]
      summary: 日前价格预测（WP2.2 统一出口：默认 LEAR，相似日为回退/显式选择）
      description: |
        body 可传 model：lear（默认）或 similar。lear 失败（无历史/算法不可达）时
        回退相似日并在响应标注 model=similar_day_fallback 与 fallback_reason；
        无历史数据直接 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_date]
              properties:
                target_date: { type: string, format: date }
                model: { type: string, enum: [lear, similar], default: lear }
      responses:
        '200':
          description: 预测结果（model/fallback_reason/forecast）
        '400':
          description: 目标日格式错误或无历史价格数据

  /api/v1/price/forecast/lear:
    post:
      tags: [价格]
      summary: LEAR 日前电价预测（LASSO 自回归 + 外生变量 + 落库）
      description: |
        取最近 60 天日前价历史 + 系统负荷外生变量 → 调 algo LEAR → 落 price_forecast_results → 返回。
        算法原理：Lago et al. Applied Energy 2021, 293:116983。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_date]
              properties:
                target_date: { type: string, format: date, description: "目标日 YYYY-MM-DD" }
                use_exogenous: { type: boolean, default: true, description: "是否取系统负荷作外生变量" }
      responses:
        '200':
          description: LEAR 预测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_date: { type: string }
                  history_days: { type: integer }
                  exogenous_days: { type: integer }
                  forecast_id: { type: string, format: uuid }
                  forecast: { $ref: '#/components/schemas/PriceForecast' }

  /api/v1/price/forecast/results:
    get:
      tags: [价格]
      summary: 查询某目标日的所有预测版本（含准确率，目标日已过会懒回填）
      parameters:
        - in: query
          name: target_date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 预测版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_date: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PriceForecastRecord' }

  /api/v1/settlement/daily:
    get:
      tags: [结算]
      summary: 批发日结算列表
      responses: { '200': { description: 日结算 } }

  /api/v1/settlement/monthly:
    get:
      tags: [结算]
      summary: 批发月度结算列表
      responses: { '200': { description: 月度结算 } }

  /api/v1/import/meter:
    post:
      tags: [负荷]
      summary: 表计数据导入（营销系统/交易中心导出 CSV/XLSX → raw_meter_data，WP0.3）
      description: |
        multipart/form-data，字段 file。dry_run 默认 true（先预览再提交）。
        版式（首行表头）：客户（名称或 UUID）、电表编号、日期、倍率（可选默认 1）、曲线。
        曲线三形态自动识别：逗号串 96/48 点（48 自动 ×2 升 96）、展开 96/48 列、
        单个日总电量 kWh（均匀铺 96 点，响应标 estimated）。
        正式导入后自动按 (customer, date) 聚合（Σ 表计曲线×倍率）写
        user_load_data + unified_load_curve（method='meter_sum'）。幂等：同 (表号,日期) 覆盖。
      parameters:
        - { in: query, name: dry_run, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 预览/导入结果（rows 逐行校验、inserted、aggregated）
        '400':
          description: 文件缺失/格式错误/未选省份

  /api/v1/load/aggregate-meter:
    post:
      tags: [负荷]
      summary: 手动触发表计负荷聚合作业（raw → user_load_data + unified_load_curve）
      parameters:
        - { in: query, name: start, schema: { type: string, format: date } }
        - { in: query, name: end, schema: { type: string, format: date } }
      responses:
        '200':
          description: 聚合统计（aggregated/skipped）
        '400':
          description: 日期参数错误

  /api/v1/dashboard/market-overview:
    get:
      tags: [仪表盘]
      summary: 市场交易概览（最近 N 个月全市场均价 vs 本公司电量，WP1.5）
      description: 任何已登录用户可访问。总部「全部省」口径：均价按月取各省均值、电量汇总。
      parameters:
        - { in: query, name: months, schema: { type: integer, default: 6 } }
      responses:
        '200':
          description: 月份/市场均价(元/MWh)/本公司电量(MWh) 列表

  /api/v1/price/import-day-ahead:
    post:
      tags: [价格]
      summary: 现货日前价导入（交易中心导出 CSV/XLSX → day_ahead_spot_price）
      description: |
        multipart/form-data，字段 file。dry_run 默认 true（先预览再提交，false 正式入库）。
        版式（首行表头）：长格式 日期/时段(1-48 或 1-96)/价格(元/MWh)；
        宽格式 日期 + 48 或 96 个时段价格列（96 点自动两两均值降 48）。
        限价区间按活跃省规则表校验（闽 元/kWh×1000、赣 元/MWh，其余兜底 [-1000,5000]）。
        正式导入后自动重算 spot_market_daily 日聚合。写操作须选定具体省份。
      parameters:
        - in: query
          name: dry_run
          schema: { type: string, enum: ['true', 'false'], default: 'true' }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 导入预览/结果（format/rows 按日汇总/valid_days/points/agg_refreshed）
        '400':
          description: 文件缺失、格式错误或未选省份

  /api/v1/load/forecast:
    post:
      tags: [负荷]
      summary: 短期负荷预测（取客户历史 → 相似日加权 → 96 点曲线）
      description: |
        可选持久化（注入 forecastRepo 时落 short_term_load_forecast 表）。
        返回 forecast/lower/upper/total/peak/valley + method。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, target_date]
              properties:
                customer_id: { type: string, format: uuid, description: "客户ID（AGGREGATE=系统聚合）" }
                target_date: { type: string, format: date }
      responses:
        '200':
          description: 预测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id: { type: string }
                  target_date: { type: string }
                  forecast: { $ref: '#/components/schemas/LoadForecastCurve' }

  /api/v1/load/forecast/data:
    get:
      tags: [负荷]
      summary: 查短期负荷预测数据（目标日已过时懒回填 actual + 算准确率）
      parameters:
        - in: query
          name: customer_id
          required: true
          schema: { type: string }
        - in: query
          name: target_date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 预测数据（含 actual_values + accuracy）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadForecastData' }

  /api/v1/load/forecast/versions:
    get:
      tags: [负荷]
      summary: 列某客户某目标日的预测版本
      parameters:
        - in: query
          name: customer_id
          required: true
          schema: { type: string }
        - in: query
          name: target_date
          required: true
          schema: { type: string, format: date }
      responses: { '200': { description: 版本列表 } }

  /api/v1/load/forecast/performance-overview:
    get:
      tags: [负荷]
      summary: 负荷预测性能总览（按客户聚合准确率）
      responses: { '200': { description: 性能总览 } }

  /api/v1/scheduler/jobs:
    get:
      tags: [调度]
      summary: 调度任务列表（task_scheduler:read）
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduledJob' }

  /api/v1/scheduler/runs:
    get:
      tags: [调度]
      summary: 调度执行记录
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses: { '200': { description: 执行记录 } }

  /api/v1/scheduler/jobs/{id}/trigger:
    post:
      tags: [调度]
      summary: 手工触发任务（task_scheduler:write）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses: { '200': { description: 已触发 } }

  /api/v1/scheduler/jobs/{id}/enabled:
    put:
      tags: [调度]
      summary: 启用/禁用任务（task_scheduler:write）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses: { '200': { description: ok } }

  /api/v1/audit/logs:
    get:
      tags: [审计]
      summary: 操作审计列表（system:read）
      parameters:
        - in: query
          name: username
          schema: { type: string }
        - in: query
          name: method
          schema: { type: string, enum: [POST, PUT, DELETE] }
        - in: query
          name: resource
          schema: { type: string }
        - in: query
          name: days
          schema: { type: integer, default: 7 }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 审计列表（分页，total 为同条件总行数）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  total: { type: integer }
