                customer_id: { type: string, format: uuid, description: 关联客户（聚合曲线数据源） }
                storage_station_id: { type: string, format: uuid }
      responses:
        '200': { description: 已保存 }
        '400': { description: 参数错误/未选省份 }

  /api/vpp/aggregate-curve:
    get:
      tags: [系统]
      summary: VPP 聚合曲线（WP5.3：Σ 关联客户 curve_96，kW→MW）
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200': { description: 96 点聚合曲线（无关联数据返回空数组与 empty_reason） }

  /api/v1/vpp/dispatch-invites:
