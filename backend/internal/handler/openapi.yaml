  /api/v1/vpp/monthly-revenue:
    get:
      tags: [系统]
      summary: VPP 近 N 月邀约收益汇总（前端趋势真数据源）
      parameters:
        - { in: query, name: months, schema: { type: integer, default: 6 } }
      responses:
        '200': { description: 月份×收益列表 }

  /api/v1/freq/performance:
    get:
      tags: [系统]
      summary: 调频考核指标列表（WP5.2：雷达图真数据源）
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: 指标列表（五项评分 + 里程） }

  /api/v1/freq/performance/import:
    post:
      tags: [系统]
      summary: 调频考核指标导入（WP5.2，CSV：日期,类型,响应,精度,持续,延迟,容量,里程）
      description: dry_run 默认 true（逐行校验 0-100 评分/AGC-AVC 类型/日期格式）。
      parameters:
        - { in: query, name: dry_run, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 预览/导入结果 }
        '400': { description: 文件缺失/未选省份 }

  /api/v1/freq/clearing/recalculate:
    post:
      tags: [系统]
      summary: 调频清算参数化重算（WP5.2，替换 rand 造数）
      description: |
        按考核指标（里程/容量评分）与规则参数（freq_mileage_price /
        freq_capacity_comp_coef，闽/皖规则表可调）重算某日清算：
        revenue = 里程×里程价 + 容量评分/100×系数×里程×里程价。
        无该日考核数据返回 400 引导先导入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '200': { description: 重算结果（含所用参数） }
        '400': { description: 无考核数据/参数错误 }

  /api/v1/storage/stations:
