        '400': { description: 状态不允许 }

  /api/v1/declarations/{id}/export:
    get:
      tags: [价格]
      summary: 申报报送单导出（xlsx/csv 量价格式；平台直连为后续 adapter）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: format, schema: { type: string, enum: [xlsx, csv], default: xlsx } }
      responses:
        '200': { description: 报送单文件流 }

  /api/v1/trade/bidding/backtest:
    post:
      tags: [价格]
      summary: 竞价策略回测（WP3.3，真实日前价历史 → 逐日模拟盈亏/敏感性/推荐）
      description: |
        策略模型：日申报量 + 报价上限 cap + 基准采购价（缺省=历史均价）。
        逐日：日均出清价 ≤ cap 成交（盈亏=vol×(bench−avg)），否则按基准价补购（盈亏 0）。
        响应含三面板数据：backtest（daily+summary）、sensitivity（cap ±10%/±20% 档）、
        recommendation（累计盈亏最高档）。日前价历史 <7 天返回 400 引导导入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume_mwh_per_day, price_cap]
              properties:
                days: { type: integer, default: 60, description: 历史窗口天数 }
                volume_mwh_per_day: { type: number, description: 日申报量 MWh }
                price_cap: { type: number, description: 报价上限 元/MWh }
                benchmark_price: { type: number, description: 基准采购价（缺省历史均价） }
      responses:
        '200': { description: backtest + sensitivity + recommendation }
        '400': { description: 参数错误或日前价历史不足 }

  /api/v1/contract-price/daily-summary:
