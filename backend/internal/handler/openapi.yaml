# 本文件是 OpenAPI 规范的唯一来源（single source of truth）：
#   - 后端经 go:embed 内嵌（docs.go），运行时由 /docs/openapi.yaml 提供
#   - 前端 `npm run gen-api-types` 由此生成 lib/api/types.gen.ts
# 不要在别处复制本文件（曾有 backend/docs/openapi.yaml 拷贝，已于 2026-06 删除）。
openapi: 3.1.0
info:
  title: PTIS 网关 API
  version: '1.0'
  description: |
    电力交易信息系统网关接口。
    所有 `/api/v1/*` 端点除 `/auth/login` 外均需 Bearer JWT 鉴权；
    业务写操作另外受 RBAC 权限码控制（如 `customer_management:write`）。

servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://ptis.example.com
    description: 生产（替换为实际域名）

tags:
  - name: 系统
  - name: 认证
  - name: 仪表盘
  - name: 客户
  - name: 零售
  - name: 价格
  - name: 结算
  - name: 调度
  - name: 审计

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: '权限不足' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: admin123 }
    LoginResponse:
      # 登录态同时经 Set-Cookie(ptis_token, httpOnly)下发;body 中的 token 仅供脚本/工具。
      type: object
      required: [token, user_id, username]
      properties:
        token:    { type: string }
        user_id:  { type: string, format: uuid }
        username: { type: string }
    DashboardSummary:
      type: object
      required: [customer_count, active_contracts, active_packages, pending_alerts, critical_alerts, active_stations, storage_30d_revenue, freq_7d_revenue]
      properties:
        customer_count:       { type: integer }
        active_contracts:     { type: integer }
        active_packages:      { type: integer }
        pending_alerts:       { type: integer }
        critical_alerts:      { type: integer }
        active_stations:      { type: integer }
        storage_30d_revenue:  { type: number }
        freq_7d_revenue:      { type: number }
        latest_settlement_fee:
          type: number
          nullable: true
    DailySeriesPoint:
      type: object
      required: [date, value]
      properties:
        date:  { type: string, format: date-time }
        value: { type: number }
    Customer:
      type: object
      # 与后端 db.Customer 结构对齐（customer_repository.go）。
      required: [id, user_name, tags, is_demo, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        user_name:  { type: string }
        short_name: { type: string, nullable: true }
        location:   { type: string, nullable: true }
        source:     { type: string, nullable: true }
        manager:    { type: string, nullable: true }
        tags:       { type: array, items: { type: string } }
        accounts:   { type: object, additionalProperties: true, nullable: true, description: "账户 JSON（自由结构）" }
        is_demo:    { type: boolean }
        extra:      { type: object, additionalProperties: true, nullable: true, description: "扩展字段 JSON" }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        org_id:     { type: string, format: uuid, nullable: true, description: "归属省份（多租户）" }
        agent_id:   { type: string, format: uuid, nullable: true, description: "所属代理商 FK（Phase 2，取代 source 名字弱关联）" }
    ScheduledJob:
      type: object
      # 与后端调度任务结构对齐（scheduler_repository.go）。
      required: [id, name, cron_expr, handler, enabled, max_retries, trade_day_only, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string }
        description:    { type: string, nullable: true }
        cron_expr:      { type: string }
        handler:        { type: string }
        enabled:        { type: boolean }
        max_retries:    { type: integer, description: "失败最大重试次数（0=不重试）" }
        trade_day_only: { type: boolean, description: "是否仅在交易日（跳过周末+法定假日）执行" }
        last_run_at:    { type: string, format: date-time, nullable: true }
        last_status:    { type: string, nullable: true }
        last_error:     { type: string, nullable: true }
        next_run_at:    { type: string, format: date-time, nullable: true }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
    AuditLog:
      type: object
      # 必填字段（中间件落库时一定有值）；其余可空。required 让生成的 TS 类型非可选，
      # 前端可直接 a.method 访问而无需到处判空。
      required: [id, method, path, status_code, duration_ms, created_at]
      properties:
        id:            { type: string, format: uuid }
        user_id:       { type: string, format: uuid, nullable: true }
        username:      { type: string, nullable: true }
        method:        { type: string }
        path:          { type: string }
        resource:      { type: string, nullable: true }
        resource_id:   { type: string, nullable: true }
        status_code:   { type: integer }
        ip:            { type: string, nullable: true }
        user_agent:    { type: string, nullable: true }
        duration_ms:   { type: integer }
        error_message: { type: string, nullable: true }
        created_at:    { type: string, format: date-time }
    SettlementDaily:
      type: object
      # 与后端 db.SettlementDaily 对齐（settlement_repository.go）。
      required: [id, operating_date, version, created_at]
      properties:
        id:                      { type: string, format: uuid }
        operating_date:          { type: string, format: date }
        version:                 { type: string }
        contract_fee:            { type: number, nullable: true }
        day_ahead_fee:           { type: number, nullable: true }
        real_time_fee:           { type: number, nullable: true }
        total_energy_fee:        { type: number, nullable: true }
        energy_avg_price:        { type: number, nullable: true }
        deviation_recovery_fee:  { type: number, nullable: true }
        created_at:              { type: string, format: date-time }
    PeriodDetail:
      type: object
      required: [period, volume_mwh, price, fee]
      properties:
        period:      { type: integer }
        volume_mwh:  { type: number }
        price:       { type: number }
        fee:         { type: number }
    SettlementDetail:
      allOf:
        - $ref: '#/components/schemas/SettlementDaily'
        - type: object
          required: [period_details]
          properties:
            period_details:
              type: array
              items: { $ref: '#/components/schemas/PeriodDetail' }
    CarbonQuote:
      type: object
      # 与后端 db.CarbonQuote 对齐（carbon_repository.go）。
      required: [id, product, trade_date, created_at]
      properties:
        id:          { type: integer }
        product:     { type: string }
        trade_date:  { type: string, format: date }
        open_price:  { type: number, nullable: true }
        high_price:  { type: number, nullable: true }
        low_price:   { type: number, nullable: true }
        close_price: { type: number, nullable: true }
        volume:      { type: number, nullable: true }
        turnover:    { type: number, nullable: true }
        created_at:  { type: string, format: date-time }
    CarbonProductSummary:
      type: object
      required: [product, name, unit]
      properties:
        product:     { type: string }
        name:        { type: string }
        unit:        { type: string }
        latest_date: { type: string, format: date, nullable: true }
        close:       { type: number, nullable: true }
        prev_close:  { type: number, nullable: true }
        change:      { type: number, nullable: true }
        change_pct:  { type: number, nullable: true }
        volume:      { type: number, nullable: true }
        high_52w:    { type: number, nullable: true }
        low_52w:     { type: number, nullable: true }
    PricingModel:
      type: object
      required: [code, display_name, package_type, pricing_mode, enabled, sort_order]
      properties:
        code:          { type: string }
        display_name:  { type: string }
        package_type:  { type: string }
        pricing_mode:  { type: string }
        enabled:       { type: boolean }
        sort_order:    { type: integer }
    RetailPackage:
      type: object
      required: [id, package_name, package_type, is_green_power, status, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        package_name:   { type: string }
        package_type:   { type: string }
        model_code:     { type: string, nullable: true }
        is_green_power: { type: boolean }
        status:         { type: string }
        description:    { type: string, nullable: true }
        pricing_config: { type: object, additionalProperties: true, nullable: true }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
    RetailContract:
      type: object
      required: [id, customer_id, customer_name, package_id, package_name_snapshot, purchasing_energy_mwh, purchase_start_month, purchase_end_month, status, created_at, updated_at]
      properties:
        id:                    { type: string, format: uuid }
        customer_id:           { type: string, format: uuid }
        customer_name:         { type: string }
        package_id:            { type: string, format: uuid }
        package_name_snapshot: { type: string }
        purchasing_energy_mwh: { type: number }
        green_power_ratio:     { type: number, nullable: true }
        purchase_start_month:  { type: string }
        purchase_end_month:    { type: string }
        status:                { type: string }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }

    PriceForecast:
      type: object
      description: 电价预测结果（48 点曲线 + 置信带 + 摘要）
      properties:
        forecast:      { type: array, items: { type: number }, description: "48 点预测价格（元/MWh）" }
        lower:         { type: array, items: { type: number }, description: "置信带下界" }
        upper:         { type: array, items: { type: number }, description: "置信带上界" }
        total:         { type: number, description: "预测总量" }
        peak:          { type: number, description: "峰值预测" }
        valley:        { type: number, description: "谷值预测" }
        method:        { type: string, description: "算法标识（LEAR/相似日加权平均）" }
        sample_days:   { type: integer, description: "训练样本天数" }
        target_weekday: { type: integer, description: "目标日星期（0=周一）" }

    PriceForecastRecord:
      type: object
      description: 价格预测历史记录（含准确率，若已回填）
      properties:
        forecast_id:       { type: string, format: uuid }
        forecast_date:     { type: string, format: date }
        target_date:       { type: string, format: date }
        price_da_forecast: { type: array, items: { type: number } }
        forecast_method:   { type: string }
        accuracy_metrics:
          type: object
          nullable: true
          properties:
            wmape: { type: number, description: "加权平均百分比误差（0~1）" }
            mae:   { type: number }
            rmse:  { type: number }
        operator:   { type: string }
        created_at: { type: string, format: date-time }

    LoadForecastCurve:
      type: object
      description: 负荷预测曲线（96 点 + 置信带 + 摘要）
      properties:
        forecast:       { type: array, items: { type: number }, description: "96 点预测负荷（MWh）" }
        lower:          { type: array, items: { type: number } }
        upper:          { type: array, items: { type: number } }
        total:          { type: number }
        peak:           { type: number }
        valley:         { type: number }
        method:         { type: string, description: "算法标识（相似日加权平均/LEAR）" }
        sample_days:    { type: integer }

    LoadForecastData:
      type: object
      description: 负荷预测数据（含 actual 回填 + 准确率）
      properties:
        forecast_id:     { type: string, format: uuid }
        customer_id:     { type: string }
        target_date:     { type: string }
        values:          { type: array, items: { type: number }, description: "96 点预测值" }
        actual_values:   { type: array, items: { type: number }, nullable: true }
        confidence_lower: { type: array, items: { type: number }, nullable: true }
        confidence_upper: { type: array, items: { type: number }, nullable: true }
        pred_sum:        { type: number, nullable: true }
        method:          { type: string }
        accuracy:
          type: object
          nullable: true
          properties:
            wmape_accuracy: { type: number, description: "准确率（1-wmape，0~1）" }
            mae:   { type: number }
            rmse:  { type: number }

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [系统]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /metrics:
    get:
      tags: [系统]
      summary: Prometheus 指标
      security: []
      responses:
        '200':
          description: text/plain 指标输出
          content:
            text/plain: {}

  /api/v1/auth/login:
    post:
      tags: [认证]
      summary: 登录获取 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: 'ptis_token=<JWT>; HttpOnly; SameSite=Lax; Max-Age=<TTL>（Secure 在 HTTPS 下置位）'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [认证]
      summary: 退出登录（清除登录 Cookie）
      responses:
        '200':
          description: 已退出
          headers:
            Set-Cookie:
              description: 'ptis_token=; Max-Age=0（清除）'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 已退出登录 }

  /api/v1/auth/me:
    get:
      tags: [认证]
      summary: 获取当前用户
      responses:
        '200': { description: 当前用户 }

  /api/v1/dashboard/summary:
    get:
      tags: [仪表盘]
      summary: 9 个 KPI 跨模块总览
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /api/v1/dashboard/series/settlement:
    get:
      tags: [仪表盘]
      summary: 最近 N 日批发结算总电费序列
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 14, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: 日序列
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DailySeriesPoint' }

  /api/v1/dashboard/series/freq:
    get:
      tags: [仪表盘]
      summary: 最近 N 日调频收益序列
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 14 }
      responses:
        '200': { description: 日序列 }

  /api/v1/customers:
    get:
      tags: [客户]
      summary: 客户列表
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        '200':
          description: 客户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
    post:
      tags: [客户]
      summary: 新建客户（customer_management:write）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Customer' }
      responses:
        '201': { description: 已创建 }
        '403': { description: 权限不足 }

  /api/v1/customers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [客户]
      summary: 获取客户详情
      responses: { '200': { description: 客户 } }
    put:
      tags: [客户]
      summary: 更新客户（customer_management:write）
      responses: { '200': { description: 已更新 } }
    delete:
      tags: [客户]
      summary: 删除客户（customer_management:delete）
      responses: { '200': { description: 已删除 } }

  /api/v1/retail/contracts/{id}/pdf:
    post:
      tags: [零售]
      summary: 生成合同文档（WP6.2：自包含 HTML，浏览器打印即 PDF；替代 501 占位）
      description: |
        中文零依赖的自包含 HTML（内联样式 + 打印 CSS + 签章位），浏览器「打印→存为 PDF」
        即正式文件；有 MinIO 时自动归档为合同附件（contracts/{id}/contract_{id}.html）。
        服务端 Chromium 渲染真 PDF 为后续增强（format=pdf）。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 文档（text/html 或归档后附件信息） }
        '404': { description: 合同不存在 }

  /api/v1/retail/contracts:
    get:
      tags: [零售]
      summary: 零售合同列表
      responses: { '200': { description: 合同列表 } }
    post:
      tags: [零售]
      summary: 新建合同（WP6.1：默认走审批，通过后自动落库；submit_approval=false 直建）
      responses:
        '201': { description: 已直接创建 }
        '202': { description: 已提交审批 }

  /api/v1/load-data/calibrations:
    post:
      tags: [负荷]
      summary: 负荷校准计算并保存预览（WP6.4，恢复被 YAGNI 删除的校准）
      description: |
        表计侧=raw_meter_data 逐点×倍率/4 聚合；系统侧=user_load_data 合计；
        系数=meter/system。任一侧无数据返回 400 引导先导入（不臆造）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, month]
              properties:
                customer_id: { type: string, format: uuid }
                month: { type: string, description: YYYY-MM }
                note: { type: string }
      responses:
        '200': { description: 预览已保存（status=preview） }
        '400': { description: 数据缺失/参数错误 }
    get:
      tags: [负荷]
      summary: 校准台账（月份过滤）
      parameters:
        - { in: query, name: month, schema: { type: string } }
      responses:
        '200': { description: 台账列表 }

  /api/v1/load-data/calibrations/{id}/apply:
    post:
      tags: [负荷]
      summary: 应用校准（该月系统侧曲线/合计按系数缩放；重复应用拒绝）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已应用 }
        '400': { description: 不存在或已应用 }

  /api/v1/load-data/calibrations/{id}/void:
    post:
      tags: [负荷]
      summary: 作废校准（已缩放数据不自动回滚，重导可恢复）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已作废 }

  /api/v1/grid/models:
    get:
      tags: [调度]
      summary: 电网模型列表（WP3.6）
      responses:
        '200': { description: 模型列表 }
    post:
      tags: [调度]
      summary: 创建/更新电网模型（(org,name) 幂等；替代前端写死的玩具网络）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string }
                model_type: { type: string, enum: [pandapower, pgm, pypsa], default: pandapower }
                config: { type: object, description: 拓扑配置（节点/线路/负荷/机组 JSON） }
                description: { type: string }
      responses:
        '200': { description: 已保存 }
        '400': { description: 参数错误/未选省份 }

  /api/v1/grid/models/{name}/powerflow:
    post:
      tags: [调度]
      summary: 以保存的模型跑潮流（pandapower）
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200': { description: 潮流结果透传 }
        '404': { description: 模型不存在 }
        '502': { description: 算法服务不可达 }

  /api/v1/grid/models/{name}/state-estimation:
    post:
      tags: [调度]
      summary: PGM 状态估计（WP3.6：自死代码激活）
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                measurements: { type: object }
      responses:
        '200': { description: 状态估计结果（节点电压） }

  /api/v1/grid/models/{name}/short-circuit:
    post:
      tags: [调度]
      summary: PGM 短路计算（WP3.6：自死代码激活）
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
